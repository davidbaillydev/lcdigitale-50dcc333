name: APK Android LC Cuisine
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-cuisine-apk.yml"
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Le projet utilise Bun (bun.lock) ; le SDK Android est déjà préinstallé sur ubuntu-latest ($ANDROID_HOME).
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: bun install
      - name: Dossier web minimal (l'appli charge le site publié)
        run: mkdir -p dist/client && echo '<!doctype html><title>LC Cuisine</title>' > dist/client/index.html
      - run: bunx cap sync android
      - name: Build Gradle assembleDebug
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lc-cuisine-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
