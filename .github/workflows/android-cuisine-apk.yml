name: APK Android LC Cuisine
on:
  workflow_dispatch:
  push:
    paths: ["android/**", "capacitor.config.json"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - run: bun install --frozen-lockfile
      - run: mkdir -p dist/client && echo '<!doctype html><title>LC Cuisine</title>' > dist/client/index.html
      - run: bunx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lc-cuisine-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
